<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>אין חיבור — Tilted</title>
    <style>
      /* Deliberately self-contained: a stylesheet request is the thing that just
         failed. Values mirror the tokens in globals.css rather than importing them. */
      :root {
        color-scheme: dark;
        --ink-950: #0b0b0f;
        --ink-800: #1a1a21;
        --text-0: #f5f6f7;
        --text-1: #b6b8c0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
          max(1.5rem, env(safe-area-inset-bottom));
        background: var(--ink-950);
        color: var(--text-0);
        font-family:
          "Assistant",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 30ch;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.3;
        font-weight: 800;
      }
      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-1);
      }
      button {
        margin-top: 0.75rem;
        min-height: 48px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 999px;
        background: var(--text-0);
        color: var(--ink-950);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>אין חיבור לרשת</h1>
      <p>
        הערב ממשיך בלי הטלפון. ברגע שהחיבור חוזר, כל הכניסות והריביים יופיעו
        במקומם — שום דבר לא הלך לאיבוד.
      </p>
      <button type="button" onclick="location.reload()">לנסות שוב</button>
    </main>
  </body>
</html>
